name: 小源每日投研简报（Kaggle）

# 每天两次触发 Kaggle kernel 跑当期简报（Qwen3-8B + 会话内本地服务 + 三步管道），
# 简报写进 Supabase briefs 表。云端直接跑模型已废弃（OpenRouter 免费层不可用，
# 本地电脑路线已改走 Kaggle）。
on:
  schedule:
    - cron: "0 0 * * *"        # 每天 08:00 CST, 早盘（A股+港股）
    - cron: "30 12 * * *"     # 每天 20:30 CST, 晚盘（美股）
  workflow_dispatch:

jobs:
  kaggle-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Kaggle CLI
        run: pip install kaggle

      - name: 触发 Kaggle kernel 并轮询
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          cd kaggle-kernel
          # 每次 push 都带一个时间戳注释，保证产生新版本、触发一次运行
          echo "# run $(date -u +%Y%m%dT%H%M%S)Z" >> xiaoyuan_brief.py
          kaggle kernels push -p .
          echo "kernel 已触发，开始轮询状态…"
          for i in $(seq 1 40); do
            status=$(kaggle kernels status shaozhima2026/xiaoyuan-daily-brief | tr '[:upper:]' '[:lower:]')
            echo "第 $i 次检查：$status"
            case "$status" in
              *complete*) echo "kernel 跑完了，简报已写进 Supabase"; exit 0;;
              *error*|*fail*|*cancel*) echo "kernel 失败，请看 Kaggle 日志"; exit 1;;
            esac
            sleep 60
          done
          echo "轮询 40 分钟仍未完成，超时退出"; exit 1
